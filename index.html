<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Exercise 01</title>

    <style>
        body {
            text-align: center;
        }

        .light-blue {
            background-color: lightblue;
        }

        .box {
            width: 25px;
            height: 25px;
            margin: 10px auto;
        }

        .red {
            background-color: red;
        }
    </style>
</head>
<body>

    <h1>Play with colors</h1>
    
    <button type="button" id="buttonChangeColor">Change color</button>

    <br /><br />

    <!-- Combines the box size styles with the red background color style -->
    <div class="box red"></div>

    <input type="range" name="redSlider" min="1" max="255" />

    <script src="script.js"></script>
</body>
</html>
